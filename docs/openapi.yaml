openapi: 3.0.3

info:
  title: Dokkai API
  version: 0.1.0
  description: |
    **Dokkai** turns a codebase into a graph-aware vector database that local AI
    agents can read, search and document.

    This document describes the HTTP API. The running server also serves an
    interactive Swagger UI at `/docs` and ReDoc at `/redoc`, both generated from
    `/openapi.json`; this file is an enriched, portable copy (it additionally
    documents the SSE chat stream and the async-job payloads, which the
    auto-generated spec cannot express well).

    ### Typical flow
    1. `POST /config/llm` — configure the chat model (or set `OLLAMA_CHAT_MODEL`
       so it is auto-configured on startup).
    2. `POST /instances/pipeline` — ingest a repository. Returns a `job_id`.
    3. `GET /instances/jobs/{job_id}` — poll until `status = succeeded`.
    4. `POST /chat` — ask questions; the answer streams back over SSE.

  license:
    name: License TBD

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Health
    description: Liveness.
  - name: Instances
    description: Ingest repositories and track ingestion jobs.
  - name: Chat
    description: Ask questions about an ingested codebase (streaming) and manage history.
  - name: Config
    description: Configure and inspect the active LLM provider.
  - name: Graph
    description: Read-only queries over an ingested project's dependency graph.

paths:
  /:
    get:
      tags: [Health]
      summary: Health check
      operationId: root
      responses:
        "200":
          description: Service is online.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online

  # ---------------------------------------------------------------------------
  # Instances
  # ---------------------------------------------------------------------------
  /instances/pipeline:
    post:
      tags: [Instances]
      summary: Start an ingestion pipeline
      description: |
        Enqueue the full pipeline (`cgr → chunk → describe → upsert`) as a
        **background job** and return immediately with a `job_id`. Poll
        `GET /instances/jobs/{job_id}` for progress (`stage`, `stage_progress`)
        and the final result.

        `recreate` drops and rebuilds the **entire** collection (all projects)
        before inserting — needed only once after a schema change. Day-to-day
        ingestion should use `recreate: false`, which upserts entities in place
        by deterministic UUID and only removes this project's stale entities.

        **Fail-loud descriptor policy**: `describe` defaults to `true`, and
        while it's true the configured descriptor (`DESC_MODEL` /
        `DESC_PROVIDER`) is checked *before* the job is created — if it's
        missing or unavailable, the request fails immediately with `400` and
        **no job is created** (nothing is ingested). Set `describe: false` to
        opt out explicitly: the pre-flight is skipped and the pipeline runs
        without descriptions (the `summary` named vector stays empty for
        this run's chunks).
      operationId: runPipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
            examples:
              normal:
                summary: Routine re-ingest
                value:
                  repo_path: /absolute/path/to/your/repo
                  recreate: false
              migration:
                summary: One-time schema migration (wipes the collection)
                value:
                  repo_path: /absolute/path/to/your/repo
                  recreate: true
              no_describe:
                summary: Opt out of LLM descriptions (skips the descriptor pre-flight)
                value:
                  repo_path: /absolute/path/to/your/repo
                  recreate: false
                  describe: false
      responses:
        "200":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: queued
        "400":
          description: No descriptor model configured, or the configured descriptor is unavailable. No job was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_model:
                  summary: DESC_MODEL unset and no remote provider configured
                  value:
                    detail: "no descriptor model specified — set DESC_MODEL (e.g. qwen2.5-coder:3b) or configure a remote provider via DESC_PROVIDER"
                model_unavailable:
                  summary: DESC_MODEL not pulled in Ollama
                  value:
                    detail: "descriptor model 'qwen2.5-coder:3b' is not available in Ollama at http://localhost:11434 — pull it with 'ollama pull qwen2.5-coder:3b'"
        "409":
          description: A pipeline or refresh job is already queued/running for this project (derived from `repo_path`'s folder name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "another job is running for project 'your-repo'"
        "422":
          $ref: "#/components/responses/ValidationError"

  /instances/graph:
    post:
      tags: [Instances]
      summary: Start a graph-only run
      description: |
        Enqueue a graph-**only** run (`cgr`, nothing else) as a **background
        job** and return immediately with a `job_id`. Poll
        `GET /instances/jobs/{job_id}` for progress and the final result.

        Runs code-graph-rag and nothing else — no chunking, no LLM
        descriptions, no embedding, no Weaviate — so there is no descriptor
        pre-flight and this can be used without Ollama/Weaviate running at
        all. Stages go straight `cgr → done`; `result.ingest.output_json` is
        the same canonical graph JSON path (`ingested/<project>.json`) the
        full pipeline produces, and the Graph API (`GET /graph/...`) can read
        it immediately after the job succeeds.

        Shares the same per-project job lock as `/instances/pipeline` and
        `/instances/{project}/describe` — a graph-only run can't race a
        pipeline/refresh run (or another graph-only run) for the same
        project.
      operationId: runGraphOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphOnlyRequest"
            examples:
              default:
                summary: Graph-only run
                value:
                  repo_path: /absolute/path/to/your/repo
      responses:
        "200":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: queued
        "409":
          description: A pipeline, refresh, or graph-only job is already queued/running for this project (derived from `repo_path`'s folder name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "another job is running for project 'your-repo'"
        "422":
          $ref: "#/components/responses/ValidationError"

  /instances/jobs:
    get:
      tags: [Instances]
      summary: List ingestion jobs
      description: Most recent first. Jobs are held in memory and reset on server restart.
      operationId: listJobs
      responses:
        "200":
          description: All known jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /instances/{project}/describe:
    post:
      tags: [Instances]
      summary: Refresh descriptions for an ingested project
      description: |
        Re-run **only** the describe pass over a project's already-ingested
        chunks — no graph re-extraction (`cgr`), no re-embedding of unchanged
        `chunk_text` — as a **background job**. Poll
        `GET /instances/jobs/{job_id}` for progress and the final result.

        Useful when switching descriptor models (`DESC_MODEL`/`DESC_PROVIDER`)
        or filling gaps without paying for a full re-ingest.

        Re-chunks the latest graph JSON in `ingested/` and only describes
        chunks whose rebuilt `chunk_text` is byte-identical to what's stored
        in Weaviate (anti-drift guard). Entities whose source changed on disk
        since ingestion are counted `stale_source` and skipped — refresh
        never describes text that isn't what's actually indexed; re-ingest to
        pick those up. A transient generation failure never overwrites a good
        stored description with an empty one (`preserved`). Only the
        `description` property is updated — the `summary` named vector it
        feeds is re-embedded, the `code` vector is untouched.

        `force` (default `false`) bypasses the description cache, regenerating
        every eligible entity even if its source hasn't changed. Cache is
        still honored (no LLM call for unchanged entities) when omitted.

        Pre-flight, in order — each fails the request immediately with no job
        created: the project must already have chunks in Weaviate (`404`),
        its latest graph JSON must still be present in `ingested/` (`409`),
        and the descriptor model must be available (`400`, same messages as
        `POST /instances/pipeline`).
      operationId: refreshDescriptions
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: The `project_name` of an already-ingested repo.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescribeRefreshRequest"
            examples:
              default:
                summary: Cached refresh (default)
                value: {}
              force:
                summary: Force-regenerate every eligible description
                value:
                  force: true
      responses:
        "200":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: queued
        "400":
          description: No descriptor model configured, or the configured descriptor is unavailable. No job was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_model:
                  summary: DESC_MODEL unset and no remote provider configured
                  value:
                    detail: "no descriptor model specified — set DESC_MODEL (e.g. qwen2.5-coder:3b) or configure a remote provider via DESC_PROVIDER"
                model_unavailable:
                  summary: DESC_MODEL not pulled in Ollama
                  value:
                    detail: "descriptor model 'qwen2.5-coder:3b' is not available in Ollama at http://localhost:11434 — pull it with 'ollama pull qwen2.5-coder:3b'"
        "404":
          description: The project has no chunks in Weaviate — it was never ingested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "project 'your-repo' has no chunks — ingest it first with POST /instances/pipeline"
        "409":
          description: Either no graph JSON was found for this project in `ingested/`, or a pipeline/refresh job is already queued/running for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_graph_json:
                  summary: Graph JSON missing from ingested/
                  value:
                    detail: "no graph JSON found for project 'your-repo' in ingested/ — re-run POST /instances/pipeline to regenerate it"
                job_conflict:
                  summary: Another job already running for this project
                  value:
                    detail: "another job is running for project 'your-repo'"
        "422":
          $ref: "#/components/responses/ValidationError"

  /instances/jobs/{job_id}/events:
    get:
      tags: [Instances]
      summary: Stream a job's progress (SSE)
      description: |
        Streams a single job's progress as **Server-Sent Events**, mirroring
        `POST /chat`'s framing (`text/event-stream`, `event: <type>\ndata:
        <json>\n\n` lines, no-cache headers).

        Emits the current job state immediately on connect, then again
        whenever `updated_at` changes (polled internally every ~0.5s). Event
        type is `job` for in-progress updates and `done` for the terminal
        state (`status = succeeded` or `failed`) — after which the stream
        closes. The `data` payload is the same `Job` object returned by
        `GET /instances/jobs/{job_id}`.

        An unknown `job_id` returns a plain `404` (not a stream).
      operationId: streamJobEvents
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: |
            An SSE stream. Each event is `event: <type>\ndata: <json>\n\n`.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: Example event sequence
                  value: |
                    event: job
                    data: {"id":"b0dc2159-...","status":"running","stage":"describe","done":120,"total":1739,"kind":"pipeline", "...": "..."}

                    event: done
                    data: {"id":"b0dc2159-...","status":"succeeded","stage":"done","kind":"pipeline", "...": "..."}
        "404":
          $ref: "#/components/responses/NotFound"

  /instances/jobs/{job_id}:
    get:
      tags: [Instances]
      summary: Get an ingestion job
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The job's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Graph
  # ---------------------------------------------------------------------------
  /graph:
    get:
      tags: [Graph]
      summary: List projects with an ingested graph
      description: |
        Lists every project with a graph JSON in `ingested/`. Read directly
        off the filesystem — restart-proof, no separate registry. Returns
        `[]` when nothing has been ingested yet.
      operationId: listGraphs
      responses:
        "200":
          description: Projects with an ingested graph.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectGraphDTO"

  /graph/{project}:
    get:
      tags: [Graph]
      summary: Get a project's full graph
      description: |
        Returns the ingested graph for `project`, normalized to
        `{id, kind, name, qualified_name, path, absolute_path, start_line,
        end_line}` nodes and `{source, target, type}` edges.

        By default only code-entity nodes (Class, Function, Method,
        Interface, Enum, Type) are returned, plus edges between them. Pass
        `include=structural` to get every node instead (folders, files,
        modules, packages, the project, external packages) and every edge.
        Edges are always restricted to pairs where both endpoints are in the
        returned node set — no dangling endpoints.
      operationId: getGraph
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [structural]
          description: Set to `structural` to include every node/edge instead of only code entities.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5000
          description: Maximum number of nodes to return (no upper bound).
      responses:
        "200":
          description: The project's graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "404":
          description: No graph has been ingested for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"
        "422":
          $ref: "#/components/responses/ValidationError"

  /graph/{project}/neighborhood:
    get:
      tags: [Graph]
      summary: Get an entity's neighborhood
      description: |
        BFS from `entity`'s node over `CALLS`, `INHERITS`, `IMPLEMENTS`,
        `OVERRIDES`, `DEFINES` and `DEFINES_METHOD` edges only — never
        `IMPORTS` or containment/external-dependency edges.

        `direction` picks which adjacency to follow while expanding (`out` =
        outgoing edges only, `in` = incoming only, `both` = either); `depth`
        bounds the number of hops; `limit` caps the total returned node
        count (root included, closest hop first). Returned nodes carry a
        `hop` field (0 = the center entity); the center is also returned
        separately as `center`.
      operationId: getNeighborhood
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: entity
          in: query
          required: true
          schema:
            type: string
          description: Qualified name of the entity to center the neighborhood on.
          example: src.alarms.AlarmValidationUseCase
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Number of hops to expand from the entity.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [in, out, both]
            default: both
          description: Which edge direction to follow while expanding.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 200
          description: Maximum number of nodes to return, root included, closest-first.
      responses:
        "200":
          description: The entity's neighborhood.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborhoodResponse"
        "404":
          description: No graph for this project, or the entity was not found in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_graph:
                  summary: Project never ingested
                  value:
                    detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"
                entity_not_found:
                  summary: Qualified name not in this project's graph
                  value:
                    detail: "entity 'src.alarms.AlarmValidationUseCase' not found in project 'your-repo' graph"
        "422":
          $ref: "#/components/responses/ValidationError"

  /graph/{project}/files:
    get:
      tags: [Graph]
      summary: Get the file-level dependency view
      description: |
        Aggregates every relationship in the graph into file-to-file edges:
        each edge endpoint is mapped to the file it belongs to (code
        entities, modules and files map via their path; folders, packages,
        the project, and external packages are not files and drop the
        relationship). Edges between the same pair of files are aggregated
        into one edge with a total `weight` and a per relationship-type
        `types` breakdown. Self-loops and external dependencies are
        excluded — only internal file-to-file dependencies remain.
      operationId: getFileView
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's file-level dependency view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileViewResponse"
        "404":
          description: No graph has been ingested for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"

  # ---------------------------------------------------------------------------
  # Chat
  # ---------------------------------------------------------------------------
  /chat:
    post:
      tags: [Chat]
      summary: Chat with the codebase (SSE stream)
      description: |
        Retrieves the connected code context for `message` and streams an
        audience-specific answer over **Server-Sent Events**
        (`Content-Type: text/event-stream`).

        The stream emits these event types, in order:

        | event    | `data` payload |
        |----------|----------------|
        | `sources`| JSON array of retrieved chunks (see `SourceChunk`). Sent once, first. |
        | `token`  | A JSON-encoded string — one streamed chunk of the answer. Repeated. |
        | `done`   | `{ "conversation_id": "...", "answer": "<full answer>" }`. Sent once, last. |
        | `error`  | A JSON-encoded error string. Terminates the stream. |

        `project_name` **must** match the `project_name` of an ingested repo
        (the repo's top-level folder name). A non-matching value returns an
        empty `sources` array and an ungrounded answer.

        Note: curl needs `-N` to disable buffering and see tokens as they arrive.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              developer:
                summary: Developer question
                value:
                  message: how does the alarm flow work?
                  project_name: your-repo
                  audience: developer
      responses:
        "200":
          description: |
            An SSE stream. Each event is `event: <type>\ndata: <json>\n\n`.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: Example event sequence
                  value: |
                    event: sources
                    data: [{"entity_type":"Class","name":"AlarmValidationUseCase","qualified_name":"src.alarms.AlarmValidationUseCase","file_path":"src/alarms/validation.ts","start_line":10,"end_line":80,"chunk_text":"...","description":"Validates a detection and notifies clients.","score":0.77,"hop":0,"via":"seed (matched query)"}]

                    event: token
                    data: "The alarm flow"

                    event: token
                    data: " works by ..."

                    event: done
                    data: {"conversation_id":"b0dc2159-5b52-4b73-a7ca-9f094496d64b","answer":"The alarm flow works by ..."}
        "422":
          $ref: "#/components/responses/ValidationError"

  /chat/conversations:
    get:
      tags: [Chat]
      summary: List conversations
      operationId: listConversations
      responses:
        "200":
          description: All stored conversations (persisted as JSON files under `data/`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"

  /chat/conversations/{conversation_id}:
    get:
      tags: [Chat]
      summary: Get a conversation
      operationId: getConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full conversation history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Chat]
      summary: Delete a conversation
      operationId: deleteConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Conversation deleted
                  conversation_id:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Config
  # ---------------------------------------------------------------------------
  /config/llm:
    post:
      tags: [Config]
      summary: Set the LLM provider
      description: |
        Configure and validate the active chat model. `is_local: true` targets a
        local Ollama instance; `is_local: false` requires
        `provider_data.key` and validates connectivity with the remote provider.
        Validation probes the exact `provider_data.model` given (see
        `GET /config/llm/health`) — an invalid or retired remote model is
        rejected with `400` and nothing is saved.
      operationId: setLlmConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigRequest"
            examples:
              ollama:
                summary: Local Ollama
                value:
                  is_local: true
                  provider_data:
                    provider_name: ollama
                    model: qwen2.5-coder:latest
              openai:
                summary: Remote OpenAI
                value:
                  is_local: false
                  provider_data:
                    provider_name: openai
                    model: gpt-4o-mini
                    key: sk-...
      responses:
        "200":
          description: Active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Config]
      summary: Get the current LLM config
      operationId: getLlmConfig
      responses:
        "200":
          description: Active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfigResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /config/llm/models:
    get:
      tags: [Config]
      summary: List available models
      description: |
        Lists models advertised by the currently configured provider. For
        `openai`/`anthropic`, this fetches the provider's live models API
        (short timeout) and falls back to a static built-in list on any
        failure. `ollama` lists what's pulled locally.
      operationId: listModels
      responses:
        "200":
          description: Models for the active provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The provider could not be reached to list models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /config/llm/health:
    get:
      tags: [Config]
      summary: Check provider connectivity
      description: |
        Probes the **currently configured model** (not a hard-coded one):
        remote providers call `models.retrieve(model)` (zero generation
        tokens), Ollama checks the model is present in `/api/tags`. The same
        model-parametrized check runs at `POST /config/llm` save time
        (rejecting an invalid/retired model) and as the describe pre-flight.
      operationId: checkHealth
      responses:
        "200":
          description: Health of the active provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthResponse"
        "404":
          $ref: "#/components/responses/NotFound"

# =============================================================================
components:
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid configuration or provider validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
      example:
        detail: job not found

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf: [{ type: string }, { type: integer }]
              msg: { type: string }
              type: { type: string }

    IngestRequest:
      type: object
      required: [repo_path]
      properties:
        repo_path:
          type: string
          description: Absolute path to the repository to ingest.
          example: /Users/you/projects/your-repo
        recreate:
          type: boolean
          default: false
          description: Drop & rebuild the whole collection (all projects) before inserting.
        describe:
          type: boolean
          default: true
          description: >-
            On by default. Set to `false` to opt out of per-entity LLM
            descriptions for this run — this also skips the descriptor
            pre-flight (so the request never fails with `400` for a
            missing/unavailable descriptor), and the `summary` named vector
            stays empty for every chunk in this run.

    GraphOnlyRequest:
      type: object
      required: [repo_path]
      properties:
        repo_path:
          type: string
          description: Absolute path to the repository to graph.
          example: /Users/you/projects/your-repo

    DescribeRefreshRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: Bypass the description cache — every eligible entity is regenerated, even if its source hasn't changed.

    RefreshResult:
      type: object
      description: Result of a describe-refresh job.
      properties:
        project_name: { type: string }
        chunks_indexed: { type: integer, description: Total chunks currently stored for this project in Weaviate. }
        eligible: { type: integer, description: Chunks whose rebuilt chunk_text matched the stored one, and were passed to the descriptor. }
        stale_source: { type: integer, description: "Rebuilt chunk_text differs from what's stored — source changed on disk since ingestion; skipped, never described." }
        not_indexed: { type: integer, description: Rebuilt chunk with no stored counterpart (not yet ingested). }
        updated: { type: integer, description: Description property changed and was written back. }
        unchanged: { type: integer, description: New description matched the stored one — no write. }
        preserved: { type: integer, description: A transient generation failure produced an empty description; the good stored one was kept. }
        descriptions:
          $ref: "#/components/schemas/DescriptionStats"
        note:
          type: string
          description: Present only when stale_source > 0.
          example: "3 entities changed on disk since ingestion — re-ingest to refresh them"

    DescriptionStats:
      type: object
      description: Tier-2 micro-description generation stats.
      properties:
        enabled: { type: boolean, description: False when DESC_MODEL is unset. }
        reason: { type: string, description: Present when descriptions were skipped (e.g. model unavailable). }
        model: { type: string }
        describable: { type: integer, description: Entities eligible for a description (non-test, non-trivial, has source). }
        cached: { type: integer, description: Reused from the source-hash cache (no LLM call). }
        generated: { type: integer, description: Freshly generated this run. }
        failed: { type: integer }
        pending: { type: integer, description: Queued but not generated (e.g. model unavailable). }
        skipped: { type: integer, description: Entities not eligible for a description. }
        templated: { type: integer, description: "No-LLM template description (doc-less non-test Types, and Enums without methods)." }

    VectorizeResult:
      type: object
      properties:
        project_name: { type: string }
        chunks_created: { type: integer, description: Distinct objects upserted. }
        ingestion_id:
          type: string
          description: "Unique per run: `<project>-<UTC timestamp>`, e.g. `your-repo-20260708T120000`."
        descriptions:
          $ref: "#/components/schemas/DescriptionStats"

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        repo_path: { type: string, description: Empty for refresh jobs (kind = refresh). }
        recreate: { type: boolean }
        kind:
          type: string
          description: Which background job this is.
          enum: [pipeline, refresh, graph]
          default: pipeline
        project:
          type: string
          description: The project the job operates on (basename of repo_path for pipeline/graph runs; the given project for refresh jobs).
        force:
          type: boolean
          description: Refresh jobs only — whether the description cache was bypassed.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        stage:
          type: string
          description: |
            Current stage, in the unified vocabulary. Pipeline jobs progress
            `cgr → chunk → describe → upsert → done`; refresh jobs progress
            `chunk → describe → update → done`; graph-only jobs progress
            `cgr → done`.
          enum: ["", cgr, chunk, describe, upsert, update, done]
        done: { type: integer, description: Units completed in the current stage. }
        total: { type: integer, description: Units total in the current stage. }
        stage_progress:
          nullable: true
          type: object
          description: Mirrors the current stage's done/total, kept alongside them for forward compatibility.
          properties:
            stage: { type: string }
            done: { type: integer }
            total: { type: integer }
        result:
          nullable: true
          description: >-
            Shape depends on kind. Pipeline jobs nest ingest/vectorize;
            graph-only jobs nest only ingest (no vectorize key); refresh jobs
            return a RefreshResult directly.
          oneOf:
            - type: object
              title: PipelineResult
              properties:
                ingest:
                  type: object
                  properties:
                    output_json:
                      type: string
                      description: >-
                        Canonical graph JSON path for the project,
                        `ingested/<project>.json` — cgr's timestamped output
                        is atomically promoted (renamed) to this path on
                        success, and older timestamped leftovers for the same
                        project are removed. This is the same file the Graph
                        API (`GET /graph/...`) reads from.
                      example: ingested/your-repo.json
                vectorize:
                  $ref: "#/components/schemas/VectorizeResult"
            - $ref: "#/components/schemas/RefreshResult"
        error:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatRequest:
      type: object
      required: [message, project_name]
      properties:
        message:
          type: string
          example: "how does the alarm flow work?"
        project_name:
          type: string
          description: Must match an ingested repo's project name.
          example: your-repo
        audience:
          type: string
          enum: [developer, manager, customer]
          default: developer
        conversation_id:
          type: string
          nullable: true
          description: Continue an existing conversation, or omit to start a new one.
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
          description: Number of seed chunks to retrieve.

    SourceChunk:
      type: object
      description: A retrieved code chunk, as emitted in the `sources` SSE event.
      properties:
        entity_type: { type: string, example: Class }
        name: { type: string }
        qualified_name: { type: string }
        file_path: { type: string }
        absolute_path: { type: string, description: "Absolute path on disk, as persisted at ingest time (empty if the project was ingested before this field existed)." }
        start_line: { type: integer, nullable: true }
        end_line: { type: integer, nullable: true }
        chunk_text: { type: string }
        description: { type: string, description: Tier-2 micro-description (may be empty). }
        score: { type: number, nullable: true }
        hop: { type: integer, description: "0 = seed, 1 = direct neighbor, ..." }
        via: { type: string, description: "Provenance, e.g. 'calls ← registerRoutes'." }

    ConversationSummary:
      type: object
      properties:
        conversation_id: { type: string }
        project_name: { type: string }
        message_count: { type: integer }
        last_message_preview: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    ConversationMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        timestamp: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceChunk"

    Conversation:
      type: object
      properties:
        conversation_id: { type: string }
        project_name: { type: string }
        audience: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"

    ProviderData:
      type: object
      required: [provider_name, model]
      properties:
        provider_name:
          type: string
          enum: [openai, anthropic, ollama]
        model: { type: string, example: qwen2.5-coder:latest }
        key:
          type: string
          default: ""
          description: API key (empty for local providers).
        base_url:
          type: string
          nullable: true
          description: Custom base URL override.

    LLMConfigRequest:
      type: object
      required: [is_local, provider_data]
      properties:
        is_local:
          type: boolean
          description: True for Ollama (local); False for remote providers.
        provider_data:
          $ref: "#/components/schemas/ProviderData"

    LLMConfigResponse:
      type: object
      properties:
        is_local: { type: boolean }
        provider_name: { type: string }
        model: { type: string }
        has_key: { type: boolean }
        base_url: { type: string, nullable: true }

    AvailableModel:
      type: object
      properties:
        name: { type: string }
        provider: { type: string }

    ModelsListResponse:
      type: object
      properties:
        provider_name: { type: string }
        models:
          type: array
          items:
            $ref: "#/components/schemas/AvailableModel"

    ProviderHealthResponse:
      type: object
      properties:
        provider_name: { type: string }
        model: { type: string }
        is_local: { type: boolean }
        status:
          type: string
          enum: [healthy, unhealthy]
        message: { type: string }

    ProjectGraphDTO:
      type: object
      description: One entry of `GET /graph`'s listing.
      properties:
        project: { type: string }
        file: { type: string, description: Graph JSON filename in `ingested/`. }
        nodes: { type: integer, description: Total node count in the graph. }
        edges: { type: integer, description: Total relationship count in the graph. }
        generated_at: { type: string, description: Export timestamp from the graph JSON, or the file's mtime as a fallback. }

    GraphNodeDTO:
      type: object
      description: A normalized graph node.
      properties:
        id: { type: integer }
        kind: { type: string, example: Class }
        name: { type: string, nullable: true }
        qualified_name: { type: string, nullable: true }
        path: { type: string, nullable: true }
        absolute_path: { type: string, nullable: true }
        start_line: { type: integer, nullable: true }
        end_line: { type: integer, nullable: true }

    GraphEdgeDTO:
      type: object
      description: A normalized graph edge.
      properties:
        source: { type: integer }
        target: { type: integer }
        type: { type: string, example: CALLS }

    GraphStatsDTO:
      type: object
      properties:
        total_nodes: { type: integer, description: Count of nodes in the selected set (code-entity or structural) before limit. }
        total_edges: { type: integer, description: Count of edges among the selected nodes before limit. }
        returned_nodes: { type: integer }
        returned_edges: { type: integer }
        truncated: { type: boolean, description: True when returned_nodes < total_nodes (limit cut the response). }

    GraphResponse:
      type: object
      properties:
        project: { type: string }
        generated_at: { type: string, nullable: true }
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNodeDTO"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdgeDTO"
        stats:
          $ref: "#/components/schemas/GraphStatsDTO"

    NeighborhoodNodeDTO:
      allOf:
        - $ref: "#/components/schemas/GraphNodeDTO"
        - type: object
          properties:
            hop: { type: integer, description: "0 = the center entity, 1 = direct neighbor, ..." }

    NeighborhoodStatsDTO:
      type: object
      properties:
        depth: { type: integer }
        direction: { type: string, enum: [in, out, both] }
        limit: { type: integer }
        returned_nodes: { type: integer }
        returned_edges: { type: integer }
        truncated: { type: boolean }

    NeighborhoodResponse:
      type: object
      properties:
        project: { type: string }
        entity: { type: string }
        center:
          $ref: "#/components/schemas/GraphNodeDTO"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NeighborhoodNodeDTO"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdgeDTO"
        stats:
          $ref: "#/components/schemas/NeighborhoodStatsDTO"

    FileDTO:
      type: object
      properties:
        path: { type: string, description: Repo-relative path. }
        name: { type: string }
        absolute_path: { type: string, nullable: true }

    FileEdgeDTO:
      type: object
      properties:
        source: { type: string, description: Source file path. }
        target: { type: string, description: Target file path. }
        weight: { type: integer, description: Total aggregated relationship count between the two files. }
        types:
          type: object
          additionalProperties:
            type: integer
          description: 'Per relationship-type breakdown, e.g. `{"CALLS": 3, "IMPORTS": 1}`.'

    FileViewStatsDTO:
      type: object
      properties:
        files: { type: integer }
        edges: { type: integer }

    FileViewResponse:
      type: object
      properties:
        project: { type: string }
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileDTO"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/FileEdgeDTO"
        stats:
          $ref: "#/components/schemas/FileViewStatsDTO"
