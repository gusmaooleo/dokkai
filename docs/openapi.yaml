openapi: 3.0.3

info:
  title: Dokkai API
  version: 0.1.0
  description: |
    **Dokkai** turns a codebase into a graph-aware vector database that local AI
    agents can read, search and document.

    This document describes the HTTP API. The running server also serves an
    interactive Swagger UI at `/docs` and ReDoc at `/redoc`, both generated from
    `/openapi.json`; this file is an enriched, portable copy (it additionally
    documents the SSE chat stream and the async-job payloads, which the
    auto-generated spec cannot express well).

    ### Typical flow
    0. `POST /auth/login` — every route below is authenticated (see the
       `Auth` tag); log in (default `admin`/`admin` on first boot) and send
       the returned token as `Authorization: Bearer <token>` on every
       subsequent request.
    1. `POST /config/llm` — configure the chat model (or set `OLLAMA_CHAT_MODEL`
       so it is auto-configured on startup). Requires the `admin` role.
    2. `POST /instances/pipeline` — ingest a repository. Returns a `job_id`.
    3. `GET /instances/jobs/{job_id}` — poll until `status = succeeded`.
    4. `POST /chat` — ask questions; the answer streams back over SSE.

  license:
    name: License TBD

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness.
  - name: Auth
    description: >-
      Always-on bearer-token authentication. Roles: `admin` (everything, plus
      user management and `POST /config/llm`), `user` (chat, ingestion,
      deletes, all reads — no user management, no `POST /config/llm`),
      `viewer` (read-only GETs only).
  - name: Instances
    description: Ingest repositories and track ingestion jobs.
  - name: Chat
    description: Ask questions about an ingested codebase (streaming) and manage history.
  - name: Config
    description: Configure and inspect the active LLM provider.
  - name: Graph
    description: Read-only queries over an ingested project's dependency graph.
  - name: Routines
    description: >-
      Code review / bug-hunt routines, run as background jobs on the same job
      system as ingestion, plus the playbooks/skills documents a run can
      attach to its prompt. Sub-part A shipped `kind: review`; sub-part B
      adds `kind: bughunt` (Ollama-native tool-calling loop only in this
      release) and the playbooks/skills CRUD.

paths:
  /:
    get:
      tags: [Health]
      summary: Health check
      operationId: root
      security: []
      responses:
        "200":
          description: Service is online.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Authenticate with `username`/`password` and receive a bearer token
        valid for 30 days. Public — no token required.

        Bad credentials return a single `401` message regardless of whether
        the username or the password was wrong. Also runs the admin-seeding
        check (self-heals a boot that happened while Postgres was down) and
        purges expired sessions opportunistically.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  username: admin
                  password: admin
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Wrong username or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "invalid username or password"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/status:
    get:
      tags: [Auth]
      summary: Auth status
      description: |
        Public. Reports that auth is enabled (always `true`) and whether the
        default `admin`/`admin` credentials are still active
        (`default_admin_active`) — the CLI and the planned UI use this to
        warn until the default password is changed.
      operationId: authStatus
      security: []
      responses:
        "200":
          description: Auth status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Invalidate the session (bearer token) used for this request. Requires any authenticated role.
      operationId: logout
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "logged out" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: Requires any authenticated role.
      operationId: getMe
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/users:
    get:
      tags: [Auth]
      summary: List users
      description: Requires the `admin` role. Never includes password hashes.
      operationId: listUsers
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Auth]
      summary: Create a user
      description: Requires the `admin` role.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              default:
                value:
                  username: alice
                  password: "correct horse battery staple"
                  role: user
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "username 'alice' already exists"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/users/{user_id}:
    delete:
      tags: [Auth]
      summary: Delete a user
      description: |
        Requires the `admin` role. Guards: you cannot delete your own user
        (`400`), and you cannot delete the last remaining admin (`400`).
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "user deleted" }
        "400":
          description: Self-delete or last-admin guard triggered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                self_delete:
                  summary: Deleting your own user
                  value:
                    detail: "you cannot delete your own user"
                last_admin:
                  summary: Deleting the last admin
                  value:
                    detail: "cannot delete the last admin user"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No user with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "user not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/users/me/password:
    patch:
      tags: [Auth]
      summary: Change your own password
      description: |
        Requires any authenticated role. Verifies `current_password` first
        (`401` on mismatch). Invalidates every *other* session for this
        user — the session making this request stays valid.
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "password updated" }
        "401":
          description: Missing/invalid session, or `current_password` didn't match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_session:
                  summary: Missing or invalid bearer token
                  value:
                    detail: "missing bearer token"
                bad_current_password:
                  summary: current_password didn't match
                  value:
                    detail: "invalid current password"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------------
  # Instances
  # ---------------------------------------------------------------------------
  /instances/pipeline:
    post:
      tags: [Instances]
      summary: Start an ingestion pipeline
      description: |
        Enqueue the full pipeline (`cgr → chunk → describe → upsert`) as a
        **background job** and return immediately with a `job_id`. Poll
        `GET /instances/jobs/{job_id}` for progress (`stage`, `stage_progress`)
        and the final result.

        `recreate` drops and rebuilds the **entire** collection (all projects)
        before inserting — needed only once after a schema change. Day-to-day
        ingestion should use `recreate: false`, which upserts entities in place
        by deterministic UUID and only removes this project's stale entities.

        **Fail-loud descriptor policy**: `describe` defaults to `true`, and
        while it's true the configured descriptor (`DESC_MODEL` /
        `DESC_PROVIDER`) is checked *before* the job is created — if it's
        missing or unavailable, the request fails immediately with `400` and
        **no job is created** (nothing is ingested). Set `describe: false` to
        opt out explicitly: the pre-flight is skipped and the pipeline runs
        without descriptions (the `summary` named vector stays empty for
        this run's chunks).

        Requires the `admin` or `user` role.
      operationId: runPipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
            examples:
              normal:
                summary: Routine re-ingest
                value:
                  repo_path: /absolute/path/to/your/repo
                  recreate: false
              migration:
                summary: One-time schema migration (wipes the collection)
                value:
                  repo_path: /absolute/path/to/your/repo
                  recreate: true
              no_describe:
                summary: Opt out of LLM descriptions (skips the descriptor pre-flight)
                value:
                  repo_path: /absolute/path/to/your/repo
                  recreate: false
                  describe: false
      responses:
        "200":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: queued
        "400":
          description: No descriptor model configured, or the configured descriptor is unavailable. No job was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_model:
                  summary: DESC_MODEL unset and no remote provider configured
                  value:
                    detail: "no descriptor model specified — set DESC_MODEL (e.g. qwen2.5-coder:3b) or configure a remote provider via DESC_PROVIDER"
                model_unavailable:
                  summary: DESC_MODEL not pulled in Ollama
                  value:
                    detail: "descriptor model 'qwen2.5-coder:3b' is not available in Ollama at http://localhost:11434 — pull it with 'ollama pull qwen2.5-coder:3b'"
        "409":
          description: A pipeline or refresh job is already queued/running for this project (derived from `repo_path`'s folder name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "another job is running for project 'your-repo'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /instances/graph:
    post:
      tags: [Instances]
      summary: Start a graph-only run
      description: |
        Enqueue a graph-**only** run (`cgr`, nothing else) as a **background
        job** and return immediately with a `job_id`. Poll
        `GET /instances/jobs/{job_id}` for progress and the final result.

        Runs code-graph-rag and nothing else — no chunking, no LLM
        descriptions, no embedding, no Weaviate — so there is no descriptor
        pre-flight and this can be used without Ollama/Weaviate running at
        all. Stages go straight `cgr → done`; `result.ingest.output_json` is
        the same canonical graph JSON path (`ingested/<project>.json`) the
        full pipeline produces, and the Graph API (`GET /graph/...`) can read
        it immediately after the job succeeds.

        Shares the same per-project job lock as `/instances/pipeline` and
        `/instances/{project}/describe` — a graph-only run can't race a
        pipeline/refresh run (or another graph-only run) for the same
        project.

        Requires the `admin` or `user` role.
      operationId: runGraphOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphOnlyRequest"
            examples:
              default:
                summary: Graph-only run
                value:
                  repo_path: /absolute/path/to/your/repo
      responses:
        "200":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: queued
        "409":
          description: A pipeline, refresh, or graph-only job is already queued/running for this project (derived from `repo_path`'s folder name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "another job is running for project 'your-repo'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /instances/jobs:
    get:
      tags: [Instances]
      summary: List ingestion jobs
      description: |
        Most recent first. Merges live (in-memory) jobs with job history
        persisted in Postgres — results survive a server restart; only the
        live progress of an in-flight job is in-memory only. If Postgres is
        unreachable, history is silently unavailable and just the live jobs
        are returned — unless Postgres is unreachable *entirely*, in which
        case this route (like every non-public route) 503s at the
        auth layer before its own handler runs, since resolving the bearer
        token also requires Postgres.

        Requires any authenticated role.
      operationId: listJobs
      responses:
        "200":
          description: All known jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /instances/{project}/describe:
    post:
      tags: [Instances]
      summary: Refresh descriptions for an ingested project
      description: |
        Re-run **only** the describe pass over a project's already-ingested
        chunks — no graph re-extraction (`cgr`), no re-embedding of unchanged
        `chunk_text` — as a **background job**. Poll
        `GET /instances/jobs/{job_id}` for progress and the final result.

        Useful when switching descriptor models (`DESC_MODEL`/`DESC_PROVIDER`)
        or filling gaps without paying for a full re-ingest.

        Re-chunks the latest graph JSON in `ingested/` and only describes
        chunks whose rebuilt `chunk_text` is byte-identical to what's stored
        in Weaviate (anti-drift guard). Entities whose source changed on disk
        since ingestion are counted `stale_source` and skipped — refresh
        never describes text that isn't what's actually indexed; re-ingest to
        pick those up. A transient generation failure never overwrites a good
        stored description with an empty one (`preserved`). Only the
        `description` property is updated — the `summary` named vector it
        feeds is re-embedded, the `code` vector is untouched.

        `force` (default `false`) bypasses the description cache, regenerating
        every eligible entity even if its source hasn't changed. Cache is
        still honored (no LLM call for unchanged entities) when omitted.

        Pre-flight, in order — each fails the request immediately with no job
        created: the project must already have chunks in Weaviate (`404`),
        its latest graph JSON must still be present in `ingested/` (`409`),
        and the descriptor model must be available (`400`, same messages as
        `POST /instances/pipeline`).

        Requires the `admin` or `user` role.
      operationId: refreshDescriptions
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: The `project_name` of an already-ingested repo.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescribeRefreshRequest"
            examples:
              default:
                summary: Cached refresh (default)
                value: {}
              force:
                summary: Force-regenerate every eligible description
                value:
                  force: true
      responses:
        "200":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: queued
        "400":
          description: No descriptor model configured, or the configured descriptor is unavailable. No job was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_model:
                  summary: DESC_MODEL unset and no remote provider configured
                  value:
                    detail: "no descriptor model specified — set DESC_MODEL (e.g. qwen2.5-coder:3b) or configure a remote provider via DESC_PROVIDER"
                model_unavailable:
                  summary: DESC_MODEL not pulled in Ollama
                  value:
                    detail: "descriptor model 'qwen2.5-coder:3b' is not available in Ollama at http://localhost:11434 — pull it with 'ollama pull qwen2.5-coder:3b'"
        "404":
          description: The project has no chunks in Weaviate — it was never ingested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "project 'your-repo' has no chunks — ingest it first with POST /instances/pipeline"
        "409":
          description: Either no graph JSON was found for this project in `ingested/`, or a pipeline/refresh job is already queued/running for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_graph_json:
                  summary: Graph JSON missing from ingested/
                  value:
                    detail: "no graph JSON found for project 'your-repo' in ingested/ — re-run POST /instances/pipeline to regenerate it"
                job_conflict:
                  summary: Another job already running for this project
                  value:
                    detail: "another job is running for project 'your-repo'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /instances/jobs/{job_id}/events:
    get:
      tags: [Instances]
      summary: Stream a job's progress (SSE)
      description: |
        Streams a single job's progress as **Server-Sent Events**, mirroring
        `POST /chat`'s framing (`text/event-stream`, `event: <type>\ndata:
        <json>\n\n` lines, no-cache headers).

        Emits the current job state immediately on connect, then again
        whenever `updated_at` changes (polled internally every ~0.5s). Event
        type is `job` for in-progress updates and `done` for the terminal
        state (`status = succeeded` or `failed`) — after which the stream
        closes. The `data` payload is the same `Job` object returned by
        `GET /instances/jobs/{job_id}`.

        An unknown `job_id` returns a plain `404` (not a stream).

        Requires any authenticated role.
      operationId: streamJobEvents
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: |
            An SSE stream. Each event is `event: <type>\ndata: <json>\n\n`.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: Example event sequence
                  value: |
                    event: job
                    data: {"id":"b0dc2159-...","status":"running","stage":"describe","done":120,"total":1739,"kind":"pipeline", "...": "..."}

                    event: done
                    data: {"id":"b0dc2159-...","status":"succeeded","stage":"done","kind":"pipeline", "...": "..."}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /instances/jobs/{job_id}:
    get:
      tags: [Instances]
      summary: Get an ingestion job
      description: Requires any authenticated role.
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The job's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------------
  # Graph
  # ---------------------------------------------------------------------------
  /graph:
    get:
      tags: [Graph]
      summary: List projects with an ingested graph
      description: |
        Lists every project with a graph JSON in `ingested/`. Read directly
        off the filesystem — restart-proof, no separate registry. Returns
        `[]` when nothing has been ingested yet.

        Requires any authenticated role.
      operationId: listGraphs
      responses:
        "200":
          description: Projects with an ingested graph.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectGraphDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /graph/{project}:
    get:
      tags: [Graph]
      summary: Get a project's full graph
      description: |
        Returns the ingested graph for `project`, normalized to
        `{id, kind, name, qualified_name, path, absolute_path, start_line,
        end_line}` nodes and `{source, target, type}` edges.

        By default only code-entity nodes (Class, Function, Method,
        Interface, Enum, Type) are returned, plus edges between them. Pass
        `include=structural` to get every node instead (folders, files,
        modules, packages, the project, external packages) and every edge.
        Edges are always restricted to pairs where both endpoints are in the
        returned node set — no dangling endpoints.

        Requires any authenticated role.
      operationId: getGraph
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [structural]
          description: Set to `structural` to include every node/edge instead of only code entities.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5000
          description: Maximum number of nodes to return (no upper bound).
      responses:
        "200":
          description: The project's graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "404":
          description: No graph has been ingested for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /graph/{project}/entity:
    get:
      tags: [Graph]
      summary: Get a single entity
      description: |
        Returns `name`'s graph node — resolved the same way
        `GET /graph/{project}/neighborhood` resolves its `entity` query
        parameter — enriched with `description` and `chunk_text` fetched
        from Weaviate via the same deterministic UUID lookup the MCP
        `get_entity` tool uses.

        `description`/`chunk_text` are `null` (not an error) when the
        entity has no chunk in Weaviate — e.g. a structural-only node — or
        when Weaviate itself is unreachable: the graph JSON is the source
        of truth for the entity's existence, not Weaviate.

        Requires any authenticated role.
      operationId: getEntity
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Qualified name of the entity to fetch.
          example: src.alarms.AlarmValidationUseCase
      responses:
        "200":
          description: The entity's graph node, plus its Weaviate description/chunk_text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDetailResponse"
        "404":
          description: No graph for this project, or the entity was not found in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_graph:
                  summary: Project never ingested
                  value:
                    detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"
                entity_not_found:
                  summary: Qualified name not in this project's graph
                  value:
                    detail: "entity 'src.alarms.AlarmValidationUseCase' not found in project 'your-repo' graph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /graph/{project}/neighborhood:
    get:
      tags: [Graph]
      summary: Get an entity's neighborhood
      description: |
        BFS from `entity`'s node over `CALLS`, `INHERITS`, `IMPLEMENTS`,
        `OVERRIDES`, `DEFINES` and `DEFINES_METHOD` edges only — never
        `IMPORTS` or containment/external-dependency edges.

        `direction` picks which adjacency to follow while expanding (`out` =
        outgoing edges only, `in` = incoming only, `both` = either); `depth`
        bounds the number of hops; `limit` caps the total returned node
        count (root included, closest hop first). Returned nodes carry a
        `hop` field (0 = the center entity); the center is also returned
        separately as `center`.

        Requires any authenticated role.
      operationId: getNeighborhood
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: entity
          in: query
          required: true
          schema:
            type: string
          description: Qualified name of the entity to center the neighborhood on.
          example: src.alarms.AlarmValidationUseCase
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Number of hops to expand from the entity.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [in, out, both]
            default: both
          description: Which edge direction to follow while expanding.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 200
          description: Maximum number of nodes to return, root included, closest-first.
      responses:
        "200":
          description: The entity's neighborhood.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborhoodResponse"
        "404":
          description: No graph for this project, or the entity was not found in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                no_graph:
                  summary: Project never ingested
                  value:
                    detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"
                entity_not_found:
                  summary: Qualified name not in this project's graph
                  value:
                    detail: "entity 'src.alarms.AlarmValidationUseCase' not found in project 'your-repo' graph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /graph/{project}/files:
    get:
      tags: [Graph]
      summary: Get the file-level dependency view
      description: |
        Aggregates every relationship in the graph into file-to-file edges:
        each edge endpoint is mapped to the file it belongs to (code
        entities, modules and files map via their path; folders, packages,
        the project, and external packages are not files and drop the
        relationship). Edges between the same pair of files are aggregated
        into one edge with a total `weight` and a per relationship-type
        `types` breakdown. Self-loops and external dependencies are
        excluded — only internal file-to-file dependencies remain.

        Requires any authenticated role.
      operationId: getFileView
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's file-level dependency view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileViewResponse"
        "404":
          description: No graph has been ingested for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------------
  # Routines
  # ---------------------------------------------------------------------------
  /routines/runs:
    post:
      tags: [Routines]
      summary: Launch a routine run
      description: |
        Launch a routine run (`kind: review` or `kind: bughunt`) as a
        **background job** on the same job system as ingestion, and return
        immediately with `run_id`/`job_id`. Poll `GET /routines/runs/{run_id}`
        (or stream `GET /instances/jobs/{job_id}/events`, same SSE framing as
        ingestion jobs) for live per-stage progress and the final result.
        Review progresses `diff` → `context` → `playbooks` → `skills` →
        `analyze` → `summarize`; bug hunt progresses `resolve` → `playbooks`
        → `hunt` → `findings` → `summarize`.

        Pre-flights run **before** the job is created, in order, so a bad
        request fails synchronously with an actionable message instead of
        only surfacing inside the job's result: the project must have an
        ingested graph (`404`); for `kind: review`, its `repo_path` must be a
        git repository and `base_ref` (or the project's default base
        branch)/`target_ref` must resolve (`400` — skipped for
        `kind: bughunt`, which has no diff to anchor against); every named
        `playbooks` entry must exist and apply to this run's `kind`, at most
        4 (`400`); the LLM — resolved from the launch payload's
        `model`/`provider` or else the active config from `POST /config/llm`
        — must be configured and healthy (`400`); and for `kind: bughunt`
        specifically, the resolved provider must be `ollama` (`400` — the
        agentic tool-calling loop is Ollama-native only in this release).

        **Model resolution — no hardcoded default**: `model`/`provider` in
        the request body override the active LLM config (`POST /config/llm`)
        for this run only; if neither the request nor the active config
        supplies a usable provider+model, the launch fails with the
        `no_llm_configured` example below.

        A routine run and ingestion of the **same project** are mutually
        exclusive — this shares the same per-project job lock as
        `/instances/pipeline`/`/instances/graph`/`/instances/{project}/describe`.

        Requires the `admin` or `user` role.
      operationId: launchRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchRoutineRequest"
            examples:
              review_default_base:
                summary: Review against the default base branch, active LLM config
                value:
                  kind: review
                  project: your-repo
                  target_ref: feature/my-branch
              review_explicit_base:
                summary: Review against an explicit base_ref
                value:
                  kind: review
                  project: your-repo
                  target_ref: feature/my-branch
                  base_ref: develop
              review_model_override:
                summary: Override the model/provider for just this run
                value:
                  kind: review
                  project: your-repo
                  target_ref: feature/my-branch
                  model: qwen2.5-coder:14b
                  provider: ollama
              review_with_playbooks:
                summary: Review with up to 4 pushed playbooks (priority order)
                value:
                  kind: review
                  project: your-repo
                  target_ref: feature/my-branch
                  playbooks: [security-basics, house-style]
              bughunt_default:
                summary: Bug hunt over a scope, restricted to a path prefix
                value:
                  kind: bughunt
                  project: your-repo
                  scope: look for unhandled errors and resource leaks in the ingestion pipeline
                  path_prefix: src/services
              bughunt_with_playbooks:
                summary: Bug hunt with playbooks and an explicit model override
                value:
                  kind: bughunt
                  project: your-repo
                  scope: audit the auth module for privilege-escalation bugs
                  playbooks: [security-basics]
                  model: qwen2.5-coder:14b
                  provider: ollama
      responses:
        "202":
          description: Run created and job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchRoutineResponse"
        "400":
          description: >-
            A git-level failure (not a repo / unresolvable ref, `kind: review`
            only), an invalid/inapplicable/excess `playbooks` entry, no usable
            LLM could be resolved, or (`kind: bughunt` only) the resolved
            provider isn't `ollama`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_ref:
                  summary: target_ref/base_ref does not resolve (kind = review)
                  value:
                    detail: "unknown git ref 'no-such-branch' in repository '/path/to/repo'"
                playbook_not_found:
                  summary: A named playbook does not exist
                  value:
                    detail: "playbook 'security-basics' not found"
                playbook_wrong_kind:
                  summary: A named playbook doesn't apply to this run's kind
                  value:
                    detail: "playbook 'security-basics' does not apply to bughunt routines"
                too_many_playbooks:
                  summary: More than 4 playbooks named
                  value:
                    detail: "a run can use at most 4 playbooks"
                no_llm_configured:
                  summary: No LLM provider configured, and none given in the launch payload
                  value:
                    detail: "No LLM provider configured for this review. POST to /config/llm to set one up, or pass model/provider in the launch payload."
                model_unavailable:
                  summary: model override not pulled in Ollama
                  value:
                    detail: "model 'qwen2.5-coder:14b' is not available in Ollama at http://localhost:11434 — pull it with 'ollama pull qwen2.5-coder:14b'"
                bughunt_non_ollama:
                  summary: kind = bughunt resolved to a non-Ollama provider
                  value:
                    detail: "bug hunt requires Ollama-native tool calling in this release — provider 'openai' is not supported yet"
        "404":
          description: The project has no ingested graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"
        "409":
          description: A pipeline/refresh/graph/routine job is already queued/running for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "another job is running for project 'your-repo'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            Request body failed validation — includes `target_ref` missing
            for `kind: review`, or `scope` missing for `kind: bughunt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Routines]
      summary: List routine runs
      description: |
        Most recent first, optionally filtered by `project` and/or `kind`.
        Each entry carries `severity_counts` (severity → count over that
        run's findings).

        Requires any authenticated role.
      operationId: listRoutineRuns
      parameters:
        - name: project
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [review, bughunt]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Routine runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoutineRunSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /routines/runs/{run_id}:
    get:
      tags: [Routines]
      summary: Get a routine run
      description: A run's full detail, findings included. Requires any authenticated role.
      operationId: getRoutineRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The run's detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineRunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No routine run with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "routine run 'b0dc2159-5b52-4b73-a7ca-9f094496d64b' not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Routines]
      summary: Delete a routine run
      description: Cascades to the run's findings. Requires the `admin` or `user` role.
      operationId: deleteRoutineRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Routine run deleted" }
                  run_id: { type: string, format: uuid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No routine run with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "routine run 'b0dc2159-5b52-4b73-a7ca-9f094496d64b' not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /routines/git/branches:
    get:
      tags: [Routines]
      summary: List a project's git branches
      description: |
        Local branches (`refs/heads`) of the project's repository, current
        branch and most-recently-committed first, plus the resolved
        `default_base` (`origin/HEAD`'s target if set, else the first of
        `main`/`master` that exists locally).

        Requires any authenticated role.
      operationId: getBranches
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branches and default base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchesResponse"
        "400":
          description: The project's repo_path is not a git repository, or a default base branch could not be determined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "could not determine a default base branch for repository '/path/to/repo' — no origin/HEAD and no local 'main' or 'master' branch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The project has no ingested graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "no graph found for project 'your-repo' — run POST /instances/pipeline to ingest it"

  # ---------------------------------------------------------------------------
  # Routines — Playbooks / skills
  # ---------------------------------------------------------------------------
  /routines/playbooks:
    get:
      tags: [Routines]
      summary: List playbooks
      description: |
        Omits `content` in favor of `content_bytes` — use
        `GET /routines/playbooks/{name}` for the full content.

        Requires any authenticated role.
      operationId: listPlaybooks
      responses:
        "200":
          description: Playbooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaybookSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Routines]
      summary: Create a playbook
      description: |
        `routines` defaults to `["review", "bughunt"]` (applies to both
        kinds) when omitted. `content` is markdown, up to 16KB, with
        optional leading YAML frontmatter (stored/returned verbatim — not
        parsed by the API).

        Requires the `admin` or `user` role.
      operationId: createPlaybook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaybookRequest"
            examples:
              default:
                value:
                  name: security-basics
                  content: "# Security basics\n\n- Never log secrets.\n- Validate all external input."
                  routines: [review, bughunt]
      responses:
        "201":
          description: Playbook created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookDTO"
        "400":
          description: Validation failure (empty/too-long/invalid name, oversized content, or an unknown routine kind).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_name:
                  summary: name contains a slash or control character
                  value:
                    detail: "name must not contain slashes or control characters"
                content_too_large:
                  summary: content exceeds the 16KB limit
                  value:
                    detail: "playbook content exceeds the 16KB limit (17000 bytes)"
                unknown_routine:
                  summary: routines names an unknown kind
                  value:
                    detail: "unknown routine kind 'code_review' — valid kinds: review, bughunt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A playbook with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "playbook 'security-basics' already exists"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /routines/playbooks/{name}:
    get:
      tags: [Routines]
      summary: Get a playbook
      description: A playbook's full detail, `content` included. Requires any authenticated role.
      operationId: getPlaybook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The playbook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No playbook with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "playbook 'security-basics' not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Routines]
      summary: Update a playbook
      description: |
        Updates `content` and/or `routines`. Fields left unset are left
        unchanged.

        Requires the `admin` or `user` role.
      operationId: updatePlaybook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaybookRequest"
            examples:
              content_only:
                value:
                  content: "# Security basics (v2)\n\n- Never log secrets."
              routines_only:
                value:
                  routines: [bughunt]
      responses:
        "200":
          description: Updated playbook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookDTO"
        "400":
          description: Validation failure (oversized content or an unknown routine kind) — same shape as create.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No playbook with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "playbook 'security-basics' not found"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Routines]
      summary: Delete a playbook
      description: Requires the `admin` or `user` role.
      operationId: deletePlaybook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Playbook deleted" }
                  name: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No playbook with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "playbook 'security-basics' not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /routines/skills:
    get:
      tags: [Routines]
      summary: List skills
      description: |
        Omits `content` in favor of `content_bytes` — use
        `GET /routines/skills/{name}` for the full content.

        Requires any authenticated role.
      operationId: listSkills
      responses:
        "200":
          description: Skills.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Routines]
      summary: Create a skill
      description: |
        `description` is what a run's own model sees in the skills catalog
        when deciding whether to load this skill — keep it short and
        relevance-scoped. `content` is markdown, up to 16KB, with optional
        leading YAML frontmatter (stored/returned verbatim, stripped before
        the body is injected into a run's prompt).

        Requires the `admin` or `user` role.
      operationId: createSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillRequest"
            examples:
              default:
                value:
                  name: sql-injection-review
                  description: How to spot SQL injection in raw-query code paths.
                  content: "# SQL injection review\n\nLook for string-concatenated queries..."
      responses:
        "201":
          description: Skill created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDTO"
        "400":
          description: Validation failure (empty/too-long/invalid name, empty description, or oversized content).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_name:
                  summary: name contains a slash or control character
                  value:
                    detail: "name must not contain slashes or control characters"
                empty_description:
                  summary: description is empty/whitespace
                  value:
                    detail: "description must not be empty"
                content_too_large:
                  summary: content exceeds the 16KB limit
                  value:
                    detail: "skill content exceeds the 16KB limit (17000 bytes)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A skill with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "skill 'sql-injection-review' already exists"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /routines/skills/{name}:
    get:
      tags: [Routines]
      summary: Get a skill
      description: A skill's full detail, `content` included. Requires any authenticated role.
      operationId: getSkill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No skill with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "skill 'sql-injection-review' not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Routines]
      summary: Update a skill
      description: |
        Updates `description` and/or `content`. Fields left unset are left
        unchanged.

        Requires the `admin` or `user` role.
      operationId: updateSkill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkillRequest"
            examples:
              content_only:
                value:
                  content: "# SQL injection review (v2)\n\n..."
              description_only:
                value:
                  description: How to spot SQL injection and command injection in raw-query code paths.
      responses:
        "200":
          description: Updated skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDTO"
        "400":
          description: Validation failure (oversized content or empty description) — same shape as create.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No skill with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "skill 'sql-injection-review' not found"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Routines]
      summary: Delete a skill
      description: Requires the `admin` or `user` role.
      operationId: deleteSkill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Skill deleted" }
                  name: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No skill with that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "skill 'sql-injection-review' not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------------
  # Chat
  # ---------------------------------------------------------------------------
  /chat:
    post:
      tags: [Chat]
      summary: Chat with the codebase (SSE stream)
      description: |
        Retrieves the connected code context for `message` and streams an
        audience-specific answer over **Server-Sent Events**
        (`Content-Type: text/event-stream`).

        The stream emits these event types, in order:

        | event    | `data` payload |
        |----------|----------------|
        | `sources`| JSON array of retrieved chunks (see `SourceChunk`). Sent once, first. |
        | `token`  | A JSON-encoded string — one streamed chunk of the answer. Repeated. |
        | `done`   | `{ "conversation_id": "...", "answer": "<full answer>" }`. Sent once, last. |
        | `error`  | A JSON-encoded error string. Terminates the stream. |

        `project_name` **must** match the `project_name` of an ingested repo
        (the repo's top-level folder name). A non-matching value returns an
        empty `sources` array and an ungrounded answer.

        Note: curl needs `-N` to disable buffering and see tokens as they arrive.

        Requires the `admin` or `user` role.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              developer:
                summary: Developer question
                value:
                  message: how does the alarm flow work?
                  project_name: your-repo
                  audience: developer
      responses:
        "200":
          description: |
            An SSE stream. Each event is `event: <type>\ndata: <json>\n\n`.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: Example event sequence
                  value: |
                    event: sources
                    data: [{"entity_type":"Class","name":"AlarmValidationUseCase","qualified_name":"src.alarms.AlarmValidationUseCase","file_path":"src/alarms/validation.ts","start_line":10,"end_line":80,"chunk_text":"...","description":"Validates a detection and notifies clients.","score":0.77,"hop":0,"via":"seed (matched query)"}]

                    event: token
                    data: "The alarm flow"

                    event: token
                    data: " works by ..."

                    event: done
                    data: {"conversation_id":"b0dc2159-5b52-4b73-a7ca-9f094496d64b","answer":"The alarm flow works by ..."}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chat/conversations:
    get:
      tags: [Chat]
      summary: List conversations
      description: Requires any authenticated role.
      operationId: listConversations
      responses:
        "200":
          description: All stored conversations (persisted in Postgres).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chat/conversations/{conversation_id}:
    get:
      tags: [Chat]
      summary: Get a conversation
      description: Requires any authenticated role.
      operationId: getConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full conversation history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Chat]
      summary: Delete a conversation
      description: Requires the `admin` or `user` role.
      operationId: deleteConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Conversation deleted
                  conversation_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------------
  # Config
  # ---------------------------------------------------------------------------
  /config/llm:
    post:
      tags: [Config]
      summary: Set the LLM provider
      description: |
        Configure and validate the active chat model. `is_local: true` targets a
        local Ollama instance; `is_local: false` requires
        `provider_data.key` and validates connectivity with the remote provider.
        Validation probes the exact `provider_data.model` given (see
        `GET /config/llm/health`) — an invalid or retired remote model is
        rejected with `400` and nothing is saved.

        Requires the `admin` role.
      operationId: setLlmConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMConfigRequest"
            examples:
              ollama:
                summary: Local Ollama
                value:
                  is_local: true
                  provider_data:
                    provider_name: ollama
                    model: qwen2.5-coder:latest
              openai:
                summary: Remote OpenAI
                value:
                  is_local: false
                  provider_data:
                    provider_name: openai
                    model: gpt-4o-mini
                    key: sk-...
      responses:
        "200":
          description: Active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Config]
      summary: Get the current LLM config
      description: Requires any authenticated role.
      operationId: getLlmConfig
      responses:
        "200":
          description: Active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /config/llm/models:
    get:
      tags: [Config]
      summary: List available models
      description: |
        Lists models advertised by the currently configured provider. For
        `openai`/`anthropic`, this fetches the provider's live models API
        (short timeout) and falls back to a static built-in list on any
        failure. `ollama` lists what's pulled locally.

        Requires any authenticated role.
      operationId: listModels
      responses:
        "200":
          description: Models for the active provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The provider could not be reached to list models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /config/llm/health:
    get:
      tags: [Config]
      summary: Check provider connectivity
      description: |
        Probes the **currently configured model** (not a hard-coded one):
        remote providers call `models.retrieve(model)` (zero generation
        tokens), Ollama checks the model is present in `/api/tags`. The same
        model-parametrized check runs at `POST /config/llm` save time
        (rejecting an invalid/retired model) and as the describe pre-flight.

        Requires any authenticated role.
      operationId: checkHealth
      responses:
        "200":
          description: Health of the active provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

# =============================================================================
components:
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid configuration or provider validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"
    Unauthorized:
      description: Missing, invalid or expired bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              summary: No Authorization header
              value:
                detail: "missing bearer token"
            invalid:
              summary: Unknown or expired token
              value:
                detail: "invalid or expired session"
    Forbidden:
      description: Authenticated, but the user's role cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: "role 'viewer' cannot perform this action"
    ServiceUnavailable:
      description: >-
        Postgres is unreachable. Auth itself is Postgres-backed, so this can
        surface on *any* non-public route (the bearer token can't be
        resolved), not just the ones that store data in Postgres.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Opaque session token returned by `POST /auth/login`, sent as
        `Authorization: Bearer <token>`. 30-day TTL, revoked by
        `POST /auth/logout` or a password change. See the Auth tag.

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
      example:
        detail: job not found

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: "Bearer token — shown only once, at login." }
        expires_at: { type: string, format: date-time }
        role: { type: string, enum: [admin, user, viewer] }
        default_admin_active:
          type: boolean
          description: True if a user named `admin` still verifies against password `admin`.

    MeResponse:
      type: object
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, user, viewer] }
        expires_at: { type: string, format: date-time, description: Expiry of the session used for this request. }
        default_admin_active: { type: boolean }

    StatusResponse:
      type: object
      properties:
        enabled: { type: boolean, description: Always true — auth cannot be disabled. }
        default_admin_active: { type: boolean }

    UserDTO:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, user, viewer] }
        created_at: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        role: { type: string, enum: [admin, user, viewer] }

    CreateUserResponse:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, user, viewer] }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password }

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf: [{ type: string }, { type: integer }]
              msg: { type: string }
              type: { type: string }

    IngestRequest:
      type: object
      required: [repo_path]
      properties:
        repo_path:
          type: string
          description: Absolute path to the repository to ingest.
          example: /Users/you/projects/your-repo
        recreate:
          type: boolean
          default: false
          description: Drop & rebuild the whole collection (all projects) before inserting.
        describe:
          type: boolean
          default: true
          description: >-
            On by default. Set to `false` to opt out of per-entity LLM
            descriptions for this run — this also skips the descriptor
            pre-flight (so the request never fails with `400` for a
            missing/unavailable descriptor), and the `summary` named vector
            stays empty for every chunk in this run.

    GraphOnlyRequest:
      type: object
      required: [repo_path]
      properties:
        repo_path:
          type: string
          description: Absolute path to the repository to graph.
          example: /Users/you/projects/your-repo

    DescribeRefreshRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: Bypass the description cache — every eligible entity is regenerated, even if its source hasn't changed.

    RefreshResult:
      type: object
      description: Result of a describe-refresh job.
      properties:
        project_name: { type: string }
        chunks_indexed: { type: integer, description: Total chunks currently stored for this project in Weaviate. }
        eligible: { type: integer, description: Chunks whose rebuilt chunk_text matched the stored one, and were passed to the descriptor. }
        stale_source: { type: integer, description: "Rebuilt chunk_text differs from what's stored — source changed on disk since ingestion; skipped, never described." }
        not_indexed: { type: integer, description: Rebuilt chunk with no stored counterpart (not yet ingested). }
        updated: { type: integer, description: Description property changed and was written back. }
        unchanged: { type: integer, description: New description matched the stored one — no write. }
        preserved: { type: integer, description: A transient generation failure produced an empty description; the good stored one was kept. }
        descriptions:
          $ref: "#/components/schemas/DescriptionStats"
        note:
          type: string
          description: Present only when stale_source > 0.
          example: "3 entities changed on disk since ingestion — re-ingest to refresh them"

    DescriptionStats:
      type: object
      description: Tier-2 micro-description generation stats.
      properties:
        enabled: { type: boolean, description: False when DESC_MODEL is unset. }
        reason: { type: string, description: Present when descriptions were skipped (e.g. model unavailable). }
        model: { type: string }
        describable: { type: integer, description: Entities eligible for a description (non-test, non-trivial, has source). }
        cached: { type: integer, description: Reused from the source-hash cache (no LLM call). }
        generated: { type: integer, description: Freshly generated this run. }
        failed: { type: integer }
        pending: { type: integer, description: Queued but not generated (e.g. model unavailable). }
        skipped: { type: integer, description: Entities not eligible for a description. }
        templated: { type: integer, description: "No-LLM template description (doc-less non-test Types, and Enums without methods)." }

    VectorizeResult:
      type: object
      properties:
        project_name: { type: string }
        chunks_created: { type: integer, description: Distinct objects upserted. }
        ingestion_id:
          type: string
          description: "Unique per run: `<project>-<UTC timestamp>`, e.g. `your-repo-20260708T120000`."
        descriptions:
          $ref: "#/components/schemas/DescriptionStats"

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        repo_path: { type: string, description: Empty for refresh jobs (kind = refresh). }
        recreate: { type: boolean }
        kind:
          type: string
          description: Which background job this is.
          enum: [pipeline, refresh, graph]
          default: pipeline
        project:
          type: string
          description: The project the job operates on (basename of repo_path for pipeline/graph runs; the given project for refresh jobs).
        force:
          type: boolean
          description: Refresh jobs only — whether the description cache was bypassed.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        stage:
          type: string
          description: |
            Current stage, in the unified vocabulary. Pipeline jobs progress
            `cgr → chunk → describe → upsert → done`; refresh jobs progress
            `chunk → describe → update → done`; graph-only jobs progress
            `cgr → done`.
          enum: ["", cgr, chunk, describe, upsert, update, done]
        done: { type: integer, description: Units completed in the current stage. }
        total: { type: integer, description: Units total in the current stage. }
        stage_progress:
          nullable: true
          type: object
          description: Mirrors the current stage's done/total, kept alongside them for forward compatibility.
          properties:
            stage: { type: string }
            done: { type: integer }
            total: { type: integer }
        result:
          nullable: true
          description: >-
            Shape depends on kind. Pipeline jobs nest ingest/vectorize;
            graph-only jobs nest only ingest (no vectorize key); refresh jobs
            return a RefreshResult directly.
          oneOf:
            - type: object
              title: PipelineResult
              properties:
                ingest:
                  type: object
                  properties:
                    output_json:
                      type: string
                      description: >-
                        Canonical graph JSON path for the project,
                        `ingested/<project>.json` — cgr's timestamped output
                        is atomically promoted (renamed) to this path on
                        success, and older timestamped leftovers for the same
                        project are removed. This is the same file the Graph
                        API (`GET /graph/...`) reads from.
                      example: ingested/your-repo.json
                vectorize:
                  $ref: "#/components/schemas/VectorizeResult"
            - $ref: "#/components/schemas/RefreshResult"
        error:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatRequest:
      type: object
      required: [message, project_name]
      properties:
        message:
          type: string
          example: "how does the alarm flow work?"
        project_name:
          type: string
          description: Must match an ingested repo's project name.
          example: your-repo
        audience:
          type: string
          enum: [developer, manager, customer]
          default: developer
        conversation_id:
          type: string
          nullable: true
          description: Continue an existing conversation, or omit to start a new one.
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
          description: Number of seed chunks to retrieve.

    SourceChunk:
      type: object
      description: A retrieved code chunk, as emitted in the `sources` SSE event.
      properties:
        entity_type: { type: string, example: Class }
        name: { type: string }
        qualified_name: { type: string }
        file_path: { type: string }
        absolute_path: { type: string, description: "Absolute path on disk, as persisted at ingest time (empty if the project was ingested before this field existed)." }
        start_line: { type: integer, nullable: true }
        end_line: { type: integer, nullable: true }
        chunk_text: { type: string }
        description: { type: string, description: Tier-2 micro-description (may be empty). }
        score: { type: number, nullable: true }
        hop: { type: integer, description: "0 = seed, 1 = direct neighbor, ..." }
        via: { type: string, description: "Provenance, e.g. 'calls ← registerRoutes'." }

    ConversationSummary:
      type: object
      properties:
        conversation_id: { type: string }
        project_name: { type: string }
        audience: { type: string }
        title:
          type: string
          nullable: true
          description: Derived from the first user message at creation; null for conversations created before this field existed (UI falls back to the preview).
        message_count: { type: integer }
        last_message_preview: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    ConversationMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        timestamp: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceChunk"

    Conversation:
      type: object
      properties:
        conversation_id: { type: string }
        project_name: { type: string }
        audience: { type: string }
        title:
          type: string
          nullable: true
          description: Derived from the first user message at creation; null for conversations created before this field existed (UI falls back to the preview).
        created_at: { type: string }
        updated_at: { type: string }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"

    ProviderData:
      type: object
      required: [provider_name, model]
      properties:
        provider_name:
          type: string
          enum: [openai, anthropic, ollama]
        model: { type: string, example: qwen2.5-coder:latest }
        key:
          type: string
          default: ""
          description: API key (empty for local providers).
        base_url:
          type: string
          nullable: true
          description: Custom base URL override.

    LLMConfigRequest:
      type: object
      required: [is_local, provider_data]
      properties:
        is_local:
          type: boolean
          description: True for Ollama (local); False for remote providers.
        provider_data:
          $ref: "#/components/schemas/ProviderData"

    LLMConfigResponse:
      type: object
      properties:
        is_local: { type: boolean }
        provider_name: { type: string }
        model: { type: string }
        has_key: { type: boolean }
        base_url: { type: string, nullable: true }

    AvailableModel:
      type: object
      properties:
        name: { type: string }
        provider: { type: string }

    ModelsListResponse:
      type: object
      properties:
        provider_name: { type: string }
        models:
          type: array
          items:
            $ref: "#/components/schemas/AvailableModel"

    ProviderHealthResponse:
      type: object
      properties:
        provider_name: { type: string }
        model: { type: string }
        is_local: { type: boolean }
        status:
          type: string
          enum: [healthy, unhealthy]
        message: { type: string }

    ProjectGraphDTO:
      type: object
      description: One entry of `GET /graph`'s listing.
      properties:
        project: { type: string }
        file: { type: string, description: Graph JSON filename in `ingested/`. }
        nodes: { type: integer, description: Total node count in the graph. }
        edges: { type: integer, description: Total relationship count in the graph. }
        generated_at: { type: string, description: Export timestamp from the graph JSON, or the file's mtime as a fallback. }
        chunks: { type: integer, nullable: true, description: Weaviate chunk count for the project. `null` if Weaviate is unreachable. }
        repo_path: { type: string, nullable: true, description: "Absolute filesystem root of the ingested repo, derived from a `File` node's `absolute_path` minus its relative `path` suffix. `null` if underivable." }

    GraphNodeDTO:
      type: object
      description: A normalized graph node.
      properties:
        id: { type: integer }
        kind: { type: string, example: Class }
        name: { type: string, nullable: true }
        qualified_name: { type: string, nullable: true }
        path: { type: string, nullable: true }
        absolute_path: { type: string, nullable: true }
        start_line: { type: integer, nullable: true }
        end_line: { type: integer, nullable: true }

    GraphEdgeDTO:
      type: object
      description: A normalized graph edge.
      properties:
        source: { type: integer }
        target: { type: integer }
        type: { type: string, example: CALLS }

    GraphStatsDTO:
      type: object
      properties:
        total_nodes: { type: integer, description: Count of nodes in the selected set (code-entity or structural) before limit. }
        total_edges: { type: integer, description: Count of edges among the selected nodes before limit. }
        returned_nodes: { type: integer }
        returned_edges: { type: integer }
        truncated: { type: boolean, description: True when returned_nodes < total_nodes (limit cut the response). }

    GraphResponse:
      type: object
      properties:
        project: { type: string }
        generated_at: { type: string, nullable: true }
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNodeDTO"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdgeDTO"
        stats:
          $ref: "#/components/schemas/GraphStatsDTO"

    NeighborhoodNodeDTO:
      allOf:
        - $ref: "#/components/schemas/GraphNodeDTO"
        - type: object
          properties:
            hop: { type: integer, description: "0 = the center entity, 1 = direct neighbor, ..." }

    EntityDetailResponse:
      allOf:
        - $ref: "#/components/schemas/GraphNodeDTO"
        - type: object
          properties:
            description: { type: string, nullable: true, description: LLM micro-description from Weaviate. `null` if the entity has no chunk there, or Weaviate is unreachable. }
            chunk_text: { type: string, nullable: true, description: Full chunk text (header + terms + doc + source) from Weaviate. `null` under the same conditions as `description`. }

    NeighborhoodStatsDTO:
      type: object
      properties:
        depth: { type: integer }
        direction: { type: string, enum: [in, out, both] }
        limit: { type: integer }
        returned_nodes: { type: integer }
        returned_edges: { type: integer }
        truncated: { type: boolean }

    NeighborhoodResponse:
      type: object
      properties:
        project: { type: string }
        entity: { type: string }
        center:
          $ref: "#/components/schemas/GraphNodeDTO"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NeighborhoodNodeDTO"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdgeDTO"
        stats:
          $ref: "#/components/schemas/NeighborhoodStatsDTO"

    FileDTO:
      type: object
      properties:
        path: { type: string, description: Repo-relative path. }
        name: { type: string }
        absolute_path: { type: string, nullable: true }

    FileEdgeDTO:
      type: object
      properties:
        source: { type: string, description: Source file path. }
        target: { type: string, description: Target file path. }
        weight: { type: integer, description: Total aggregated relationship count between the two files. }
        types:
          type: object
          additionalProperties:
            type: integer
          description: 'Per relationship-type breakdown, e.g. `{"CALLS": 3, "IMPORTS": 1}`.'

    FileViewStatsDTO:
      type: object
      properties:
        files: { type: integer }
        edges: { type: integer }

    FileViewResponse:
      type: object
      properties:
        project: { type: string }
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileDTO"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/FileEdgeDTO"
        stats:
          $ref: "#/components/schemas/FileViewStatsDTO"

    LaunchRoutineRequest:
      type: object
      required: [kind, project]
      properties:
        kind:
          type: string
          enum: [review, bughunt]
          description: >-
            `review` diffs `target_ref` against `base_ref`; `bughunt`
            free-text-investigates `scope` over the whole project via an
            agentic tool loop (Ollama-native only in this release — a
            non-Ollama resolved provider 400s at launch).
        project:
          type: string
          description: An already-ingested project's `project_name`.
          example: your-repo
        target_ref:
          type: string
          nullable: true
          description: "Required for `kind: review` (422 if omitted). Unused for `kind: bughunt`."
          example: feature/my-branch
        base_ref:
          type: string
          nullable: true
          description: >-
            `kind: review` only. Defaults to the project repo's default base
            branch (`origin/HEAD`'s target, else local `main`/`master`) when
            omitted.
          example: develop
        scope:
          type: string
          nullable: true
          description: >-
            Required for `kind: bughunt` (422 if omitted) — a free-text
            description of what to investigate. Unused for `kind: review`.
          example: look for unhandled errors and resource leaks in the ingestion pipeline
        path_prefix:
          type: string
          nullable: true
          description: >-
            `kind: bughunt` only. Restricts *reported* findings to files
            under this repo-relative prefix; the agent may still investigate
            other files for context. Unused for `kind: review`.
          example: src/services
        model:
          type: string
          nullable: true
          description: Override the active LLM config's model for this run only.
          example: qwen2.5-coder:14b
        provider:
          type: string
          nullable: true
          description: >-
            Override the active LLM config's provider for this run only.
            Supported providers: ollama, openai, anthropic — an unknown value
            is rejected at launch with a 400, not a validation error.
            `kind: bughunt` additionally requires the resolved provider to be
            `ollama` (400 otherwise).
        playbooks:
          type: array
          items: { type: string }
          nullable: true
          description: >-
            Playbook names PUSHED into this run's prompt, in priority order
            (at most 4). Each name must already exist and must apply to this
            run's `kind` (a playbook's own `routines` field) — validated at
            launch (400). Applies to both `kind: review` and `kind: bughunt`.
            See `/routines/playbooks`. There is no equivalent field for
            skills — those are model-PULLED from the full catalog every run.
          example: [security-basics]

    LaunchRoutineResponse:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        job_id:
          type: string
          format: uuid
          description: Poll/stream this the same way as any other job — see GET /instances/jobs/{job_id} and its /events SSE route.

    RoutineRunSummary:
      type: object
      description: One entry of GET /routines/runs's listing.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [review, bughunt] }
        project: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        params:
          type: object
          description: >-
            The launch params this run was submitted with — for `kind:
            review`: repo_path, target_ref, base_ref, model, provider,
            playbooks; for `kind: bughunt`: repo_path, scope, path_prefix,
            model, provider, playbooks.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        severity_counts:
          type: object
          additionalProperties:
            type: integer
          description: 'Finding count by severity, e.g. {"high": 2, "low": 5}. Empty object if the run has no findings yet.'

    FindingDTO:
      type: object
      properties:
        id: { type: integer }
        file_path: { type: string }
        start_line: { type: integer, nullable: true }
        end_line: { type: integer, nullable: true }
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        category:
          type: string
          enum: [bug, security, performance, maintainability, style, other]
        title: { type: string }
        body: { type: string }
        suggestion: { type: string, nullable: true }
        evidence:
          type: object
          nullable: true
          description: >-
            Supporting context. `kind: review`: {hunk_excerpt, entities,
            model, provider}. `kind: bughunt`: {entities, model, provider}
            (no diff hunk to excerpt — bughunt has no diff).
        anchored:
          type: boolean
          description: >-
            `kind: review`: false when the model's start_line didn't fall
            within (±2 lines of) a changed range. `kind: bughunt`: true only
            when start_line falls within a graph code-entity's line span on
            file_path. Either way the finding is kept, not dropped, when
            unanchored — treat its line numbers as approximate. See the
            "Code review routines" section of the README.
        created_at: { type: string, format: date-time }

    RoutineRunDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        job_id:
          type: string
          format: uuid
          description: >-
            The underlying job this run executed as — poll/stream it the same
            way as any other job (GET /instances/jobs/{job_id} and its
            /events SSE route) for live per-stage progress.
        kind: { type: string, enum: [review, bughunt] }
        project: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        params:
          type: object
          description: The launch params this run was submitted with.
        summary:
          type: string
          nullable: true
          description: Markdown summary of the run. Null until the run reaches status = done.
        stats:
          type: object
          nullable: true
          description: >-
            Per-stage counters, shape depends on `kind`. `kind: review`:
            files changed/reviewable/skipped, hunks, insertions/deletions,
            entities_matched, context_chars_total, playbooks_used,
            skills_used, findings_total, findings_anchored, parse_failures,
            llm_calls, prompt_chars_total, wall_seconds_analyze,
            wall_seconds_summarize. `kind: bughunt`: rounds,
            tool_calls_made, tool_payload_chars, loaded_skills, tools_called,
            pushback_used (the mechanical read-before-report guard fired),
            playbooks_used, findings_total, findings_anchored,
            findings_dropped, parse_failures, llm_calls,
            wall_seconds_resolve, wall_seconds_hunt, wall_seconds_findings,
            wall_seconds_summarize. Both kinds include the resolved
            model/provider. Null until the run reaches a terminal status.
        error:
          type: string
          nullable: true
          description: Set when status = failed.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/FindingDTO"

    BranchInfo:
      type: object
      properties:
        name: { type: string }
        is_current: { type: boolean }
        last_commit_date: { type: string, format: date-time }

    BranchesResponse:
      type: object
      properties:
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchInfo"
        default_base: { type: string }

    PlaybookSummary:
      type: object
      description: One entry of GET /routines/playbooks's listing — omits content in favor of content_bytes.
      properties:
        id: { type: integer }
        name: { type: string }
        routines:
          type: array
          items: { type: string, enum: [review, bughunt] }
          description: Which routine kind(s) this playbook applies to — defaults to both on create.
        content_bytes: { type: integer, description: UTF-8 byte length of content (16KB max). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlaybookDTO:
      type: object
      description: Full playbook detail — GET-by-name/create/update response shape.
      properties:
        id: { type: integer }
        name: { type: string }
        routines:
          type: array
          items: { type: string, enum: [review, bughunt] }
        content:
          type: string
          description: >-
            Markdown, up to 16KB. May start with a YAML frontmatter block
            (`---\n...\n---\n`), stored/returned verbatim — the API does not
            parse it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatePlaybookRequest:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          description: >-
            Non-empty, ≤128 chars, no leading/trailing whitespace, no `/`,
            `\`, or control characters (it's a REST path segment).
          example: security-basics
        content:
          type: string
          description: Markdown, up to 16KB (UTF-8 bytes).
        routines:
          type: array
          items: { type: string, enum: [review, bughunt] }
          nullable: true
          description: Defaults to `["review", "bughunt"]` (applies to both) when omitted.

    UpdatePlaybookRequest:
      type: object
      description: Fields left unset are left unchanged.
      properties:
        content:
          type: string
          nullable: true
        routines:
          type: array
          items: { type: string, enum: [review, bughunt] }
          nullable: true

    SkillSummary:
      type: object
      description: One entry of GET /routines/skills's listing — omits content in favor of content_bytes.
      properties:
        id: { type: integer }
        name: { type: string }
        description:
          type: string
          description: What a run's own model sees in the skills catalog when deciding whether to load this skill.
        content_bytes: { type: integer, description: UTF-8 byte length of content (16KB max). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillDTO:
      type: object
      description: Full skill detail — GET-by-name/create/update response shape.
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        content:
          type: string
          description: >-
            Markdown, up to 16KB. May start with a YAML frontmatter block,
            stored/returned verbatim — stripped before the body is injected
            into a run's prompt.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSkillRequest:
      type: object
      required: [name, description, content]
      properties:
        name:
          type: string
          description: >-
            Non-empty, ≤128 chars, no leading/trailing whitespace, no `/`,
            `\`, or control characters (it's a REST path segment).
          example: sql-injection-review
        description:
          type: string
          description: Non-empty. What a run's own model sees when deciding whether to load this skill.
        content:
          type: string
          description: Markdown, up to 16KB (UTF-8 bytes).

    UpdateSkillRequest:
      type: object
      description: Fields left unset are left unchanged.
      properties:
        description:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
