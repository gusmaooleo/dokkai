services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    restart: on-failure:0
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "text2vec-ollama"
      ENABLE_MODULES: "text2vec-ollama"
      CLUSTER_HOSTNAME: "node1"
    # Embeddings are produced by Ollama running on the host. On Docker Desktop
    # (macOS/Windows) host.docker.internal resolves to the host automatically;
    # on Linux, add: extra_hosts: ["host.docker.internal:host-gateway"].

  postgres:
    image: postgres:18-alpine
    restart: on-failure:0
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dokkai
      POSTGRES_PASSWORD: dokkai
      POSTGRES_DB: dokkai
    # postgres:18+ moved the default data directory from
    # /var/lib/postgresql/data to /var/lib/postgresql — mount the volume there.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokkai -d dokkai"]
      interval: 5s
      timeout: 3s
      retries: 10

  memgraph:
    image: ${MEMGRAPH_IMAGE:-memgraph/memgraph:latest}
    restart: on-failure:0
    ports:
      - "7687:7687"
    healthcheck:
      # CMD-SHELL runs under /bin/sh, which doesn't support /dev/tcp on this
      # image (it's a bashism) — invoke bash explicitly.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/7687'"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Graph extraction (shell/run_cgr.sh via cgr). Not gated behind a
    # profile: a resident instance is part of the default infra set so both
    # `docker compose up -d` and host-run ingests (MEMGRAPH_HOST=localhost)
    # can use it instead of spinning up an ephemeral container per run.
    # `cgr --clean` wipes the graph at the start of each run, which is what
    # isolates back-to-back runs on this shared instance.

  api:
    profiles: ["full"]
    build:
      context: .
    restart: on-failure:0
    ports:
      - "8000:8000"
    # Forwards the host .env (OPENAI_API_KEY, GEMINI_API_KEY,
    # ANTHROPIC_API_KEY, GROQ_API_KEY, ... — anything config/providers.json
    # references via ${VAR}) into the container. Arbitrary provider key var
    # names can't be enumerated here individually, so the whole file is
    # forwarded; `required: false` keeps `docker compose config`/`up`
    # working for a fresh clone with no .env yet. The explicit
    # `environment:` block below still wins over anything of the same name
    # in .env (verified via `docker compose config` — Compose applies
    # env_file first, environment: last).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://dokkai:dokkai@postgres:5432/dokkai
      WEAVIATE_HOST: weaviate
      # Pinned (not left to env_file/.env): the in-container Weaviate
      # service always listens on these ports regardless of what the host
      # publishes them as — a host remap like WEAVIATE_HTTP_PORT=8081 (to
      # dodge a taken 8080 for ./dev.sh) must not leak into this container,
      # or every search/ingest call dials the wrong port and fails.
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      MEMGRAPH_HOST: memgraph
      # Ollama runs on the host, not in compose — reach it the same way
      # Weaviate does (see OLLAMA_EMBED_ENDPOINT above).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      # Rewrite seam (services/llm_provider.effective_base_url): a persisted
      # LLM config saved with base_url=localhost:11434 (e.g. from a host
      # ./dev.sh run, sharing this same Postgres) is rewritten to
      # host.docker.internal at request time — never at storage.
      DOKKAI_IN_CONTAINER: "1"
      # OLLAMA_EMBED_ENDPOINT intentionally not overridden here: it's read by
      # this process only to build the collection schema, and its default
      # (http://host.docker.internal:11434) is already correct from
      # Weaviate's perspective. DOKKAI_CORS_ORIGINS default already covers
      # http://localhost:3000, where the ui container publishes.
      DESC_MODEL: ${DESC_MODEL}
      DESC_PROVIDER: ${DESC_PROVIDER:-ollama}
      DESC_CONCURRENCY: ${DESC_CONCURRENCY:-4}
      # Default values: when the users start by runnuing docker compose --profile full up -d
      # the backend cannot see folders outside the container, so we need to set a default value for DOKKAI_REPOS_DIR
      # or clone the repo inside the container. The default value is `/tmp/dokkai-repos` 
      DOKKAI_CORS_ORIGINS: ${DOKKAI_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DOKKAI_REPOS_DIR: ${DOKKAI_REPOS_DIR:-/tmp/dokkai-repos}
    volumes:
      # Bind-mount the host's repos parent dir at the SAME path inside the
      # container, so routines (git ops via shell/run_cgr.sh, GET
      # /routines/git/*) and ingestion see repo_path values identical to a
      # host ./dev.sh run. Required for the `full` profile; defaults to a
      # harmless path so `docker compose config`/`up` without --profile full
      # (api excluded entirely) never fails on an unset var.
      - ${DOKKAI_REPOS_DIR:-/tmp/dokkai-repos}:${DOKKAI_REPOS_DIR:-/tmp/dokkai-repos}
      # Named volumes: code-graph-rag output JSONs (./ingested/) and the
      # description cache (./data/) must persist across container restarts.
      - ingested_data:/app/ingested
      - api_data:/app/data
      # LLM provider registrations (feature 22 — config/providers.json).
      # Mounts the DIRECTORY, never the file: config/providers.json is
      # gitignored, and a bind-mount whose source FILE is missing gets
      # created by Docker as a directory, breaking confusingly — the
      # directory itself is always present (it's committed, holding
      # providers.example.json), so this mount never hits that trap.
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      weaviate:
        condition: service_started
    # Linux compat for host.docker.internal (Docker Desktop on macOS/Windows
    # already resolves it without this).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: on-failure:0
    ports:
      - "3000:3000"
    # Browser-side only — no depends_on: the API/Weaviate/Postgres are reached
    # from the client's browser, not from this container.

volumes:
  weaviate_data:
  postgres_data:
  ingested_data:
  api_data:
